<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>產品畫廊</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
body{background:#f7f7f9;color:#222;padding:2rem;max-width:1400px;margin:0 auto}
h1{text-align:center;margin-bottom:2rem;font-weight:500}
.tabs{display:flex;gap:1rem;justify-content:center;margin-bottom:2rem}
.tab{padding:0.6rem 1.2rem;border:none;background:#e8e8ed;border-radius:8px;cursor:pointer;font-size:1rem}
.tab.active{background:#222;color:#fff}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:2rem}
.card{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,0.07);transition:0.25s}
.card:hover{transform:translateY(-6px);box-shadow:0 10px 24px rgba(0,0,0,0.1)}
.imgWrap{height:260px;background:#eee;overflow:hidden;cursor:pointer}
.imgWrap img{width:100%;height:100%;object-fit:cover}
.info{padding:1.2rem}
.name{font-size:1.15rem;font-weight:600;margin-bottom:0.5rem}
.price{font-size:1.05rem;color:#d23b3b;font-weight:bold}
.loading{text-align:center;padding:3rem;font-size:18px}
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.85);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
  padding:20px;
}
.modal.active{display:flex;}
.modal img{
  max-width:90%;
  max-height:90vh;
  border-radius:8px;
}
.closeBtn{
  position:absolute;
  top:16px;
  right:24px;
  color:#fff;
  font-size:36px;
  cursor:pointer;
}
</style>
</head>
<body>
<h1>產品畫廊</h1>
<div class="tabs">
  <button class="tab active" data-target="collection">Collection</button>
  <button class="tab" data-target="gallery">Gallery</button>
  <button class="tab" data-target="shops">Shops</button>
</div>
<div class="gallery" id="gallery">
  <div class="loading">載入產品中...</div>
</div>

<div class="modal" id="imageModal">
  <span class="closeBtn">&times;</span>
  <img id="modalImg" src="" alt="大圖預覽">
</div>

<script>
// ========= 已經填好你的Worker網址 =========
const WORKER_URL = "https://airtable-proxy.songdreamdeco.workers.dev/";

const galleryEl = document.getElementById("gallery");
const modal = document.getElementById("imageModal");
const modalImg = document.getElementById("modalImg");
const closeBtn = document.querySelector(".closeBtn");
const tabs = document.querySelectorAll(".tab");

function closeModal(){ modal.classList.remove("active"); }
closeBtn.onclick = closeModal;
modal.onclick = e=>{ if(e.target === modal) closeModal(); }

async function loadData(typeName){
  galleryEl.innerHTML = `<div class="loading">載入產品中...</div>`;
  try{
    const res = await fetch(`${WORKER_URL}?type=${typeName}`);
    const products = await res.json();
    galleryEl.innerHTML = "";
    products.forEach(item=>{
      const card = document.createElement("div");
      card.className="card";
      card.innerHTML = `
        <div class="imgWrap" data-img="${item.圖片}">
          ${item.圖片 ? `<img src="${item.圖片}" alt="${item.產品名稱}">` : `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#888">無圖片</div>`}
        </div>
        <div class="info">
          <div class="name">${item.產品名稱}</div>
          <div class="price">HK$${item.價格}</div>
        </div>
      `;
      galleryEl.appendChild(card);
      const imgWrap = card.querySelector(".imgWrap");
      imgWrap.addEventListener("click",()=>{
        if(imgWrap.dataset.img){
          modalImg.src = imgWrap.dataset.img;
          modal.classList.add("active");
        }
      })
    })
  }catch(err){
    console.error(err);
    galleryEl.innerHTML = `<p>讀取Airtable失敗，檢查Worker</p>`;
  }
}

tabs.forEach(tab=>{
  tab.addEventListener("click",()=>{
    tabs.forEach(t=>t.classList.remove("active"));
    tab.classList.add("active");
    loadData(tab.dataset.target);
  })
})
loadData("collection");
</script>
</body>
</html>
